[Touch]
# Pixels finger must move to trigger a swipe attack
SwipeThreshold=28
# Maximum milliseconds for a swipe (faster = attack, slower = continuous walking)
SwipeMaxTimeMs=380
# Milliseconds holding still before Right Click triggers (opens Radial/Ring Menu)
LongPressTimeMs=420
# Synthetic mouse motion delta applied during sword swipe
CombatMotionDelta=120
